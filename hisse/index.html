<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisse Senedi Teknik Analiz - Haftalık Özet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 0.75rem;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: #888;
            margin-top: 2rem;
        }
    </style>
    <script>
        async function loadData() {
            const response = await fetch('data.json');
            const data = await response.json();

            const container = document.getElementById('content');
            container.innerHTML = '';

            Object.keys(data).forEach(symbol => {
                const stock = data[symbol];
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
          <h2>${symbol}</h2>
          <p>${stock.yorum}</p>
          <table>
            <tr><th>Destek 1</th><td>${stock.destek1}</td></tr>
            <tr><th>Destek 2</th><td>${stock.destek2}</td></tr>
            <tr><th>Direnç 1</th><td>${stock.direnc1}</td></tr>
            <tr><th>Direnç 2</th><td>${stock.direnc2}</td></tr>
          </table>
          <ul>
            <li><strong>RSI:</strong> ${stock.rsi}</li>
            <li><strong>MACD:</strong> ${stock.macd}</li>
            <li><strong>50 Günlük Ortalama:</strong> ${stock.ma50}</li>
            <li><strong>200 Günlük Ortalama:</strong> ${stock.ma200}</li>
          </ul>
          <p><em>Güncelleme: ${stock.guncelleme}</em></p>
        `;
                container.appendChild(card);
            });
        }

        window.onload = loadData;
    </script>
</head>
<body>
<h1>Hisse Senedi Teknik Analiz - Haftalık Özet</h1>
<div id="content">Veriler yükleniyor...</div>

<div class="footer">
    Bu analiz ChatGPT (OpenAI) tarafından hazırlanmıştır. Yatırım tavsiyesi değildir.
</div>
</body>
</html>
