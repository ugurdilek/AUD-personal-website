<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header>
  <nav class="navbar">
    <!-- Hamburger buton -->
    <button class="menu-toggle" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>

    <ul>
      <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="/gallery" class="active"><i class="fa-solid fa-image"></i> Gallery</a></li>
      <li><a href="/resume"><i class="fa-solid fa-file-lines"></i> Resume</a></li>
      <li><a href="/contact"><i class="fa-solid fa-envelope"></i> Contact</a></li>
    </ul>
  </nav>
</header>

<main class="gallery">
  <img src="/photos/photo1.png" alt="Photo 1" />
  <img src="/photos/photo2.png" alt="Photo 2" />
  <img src="/photos/test-image.png" alt="Photo 3" />
</main>

<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <img class="lightbox-img" src="" alt="Expanded image" />
</div>

<script src="/js/script.js"></script>
</body>
</html>
