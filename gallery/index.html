<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Gallery</title>
    <link href="/css/!nostyleacx27css.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>



    <!-- Font Awesome -->
    <script>
        window.addEventListener('load', function() {
            var fa = document.createElement('link');
            fa.rel = 'stylesheet';
            fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css';
            fa.crossOrigin = 'anonymous';
            document.head.appendChild(fa);
        });
    </script>

    <!-- Google Analytics -->
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                var gtagScript = document.createElement('script');
                gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-9P7Z2XMBMH";
                gtagScript.async = true;
                document.head.appendChild(gtagScript);

                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-9P7Z2XMBMH');
            }, 2000);
        });
    </script>

    <script>
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });
    </script>

    <script>
        document.addEventListener('keydown', function (e) {
            // F12
            if (e.key === 'F12') e.preventDefault();

            // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+U / Ctrl+S
            if ((e.ctrlKey && e.shiftKey && ['I', 'J'].includes(e.key)) ||
                (e.ctrlKey && ['U', 'S'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        });
    </script>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
</head>
<body>

<header>
    <nav class="navbar">
        <ul>
            <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a class="active" href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a></li>
            <li><a href="/resume"><i class="fa-solid fa-file-lines"></i> Resume</a></li>
            <li><a href="/contact"><i class="fa-solid fa-envelope"></i> Contact</a></li>
        </ul>
    </nav>

    <button class="burger-button" aria-label="Menu">
        <svg viewBox="0 0 100 100" width="40">
            <path class="line top" d="M 30,33 H 70" />
            <path class="line middle" d="M 30,50 H 70" />
            <path class="line bottom" d="M 30,67 H 70" />
        </svg>
    </button>
</header>

<main class="gallery">
    <figure>
        <img alt="Karakoy, Istanbul, Turkey" src="/photos/KarakoyIstanbulTurkey.png">
        <figcaption>Karakoy, Istanbul, Turkey</figcaption>
    </figure>
    <figure>
        <img alt="Cappadocia, Nevşehir, Turkey" src="/photos/CappadociaNevsehirTurkey.png">
        <figcaption>Cappadocia, Nevsehir, Turkey</figcaption>
    </figure>
    <figure>
        <img alt="St. Anthony of Padua Church ,Istanbul, Turkey" src="/photos/St.AnthonyPaduaChurch.png">
        <figcaption>St. Anthony of Padua Church ,Istanbul, Turkey</figcaption>
    </figure>
</main>

<div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <img alt="Expanded image" class="lightbox-img" src=""/>
</div>

<script src="/js/script.js"></script>
</body>
</html>
