<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gallery – Ahmet Uğur Dilek</title>
    <meta content="A gallery showcasing photographs" name="description">

    <!-- Canonical link for SEO -->
    <link href="https://www.ugurdilek.com/gallery" rel="canonical"/>

    <!-- CSS Styles -->
    <link as="style" href="/css/!nostyleacx27css.css" rel="preload"/>
    <link href="/css/!nostyleacx27css.css" rel="stylesheet"/>

    <!-- Font Awesome Icons -->
    <script>
        window.addEventListener('load', function () {
            const fa = document.createElement('link');
            fa.rel = 'stylesheet';
            fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css';
            fa.crossOrigin = 'anonymous';
            document.head.appendChild(fa);
        });
    </script>

    <!-- Google Analytics Tracking -->
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                const gtagScript = document.createElement('script');
                gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-9P7Z2XMBMH";
                gtagScript.async = true;
                document.head.appendChild(gtagScript);

                window.dataLayer = window.dataLayer || [];

                function gtag() {
                    dataLayer.push(arguments);
                }

                gtag('js', new Date());
                gtag('config', 'G-9P7Z2XMBMH');
            }, 2000);
        });
    </script>

    <!-- Basic Security: Disable right click & developer shortcuts -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            const keys = ['F12', 'U', 'S', 'I', 'J'];
            if ((e.key === 'F12') || (e.ctrlKey && (keys.includes(e.key.toUpperCase()) || (e.shiftKey && ['I', 'J'].includes(e.key))))) {
                e.preventDefault();
            }
        });
    </script>

    <!-- Favicon -->
    <link href="/favicon.ico" rel="icon" type="image/x-icon"/>
</head>

<body>

<!-- Site Header with Navigation -->
<header>
    <nav class="navbar">
        <ul>
            <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a class="active" href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a></li>
            <li><a href="/resume"><i class="fa-solid fa-file-lines"></i> Resume</a></li>
            <li><a href="/contact"><i class="fa-solid fa-envelope"></i> Contact</a></li>
        </ul>
    </nav>

    <!-- Mobile Burger Menu Button -->
    <div class="top-bar">
        <button aria-label="Menu" class="burger-button">
            <svg viewBox="0 0 100 100" width="40">
                <circle class="circle-bg" cx="52" cy="48" r="45"/>
                <path class="line top"      d="M 10,35 H 70"/>
                <path class="line middle"   d="M 20,50 H 60"/>
                <path class="line bottom"   d="M 10,65 H 70"/>
            </svg>
        </button>
    </div>
</header>

<!-- Site Footer with Navigation -->
<footer class="bottom-bar">
    <div class="footer-content">
        <span class="motto"><em>İyilik, iyidir.</em></span>
    </div>
</footer>


<!-- Scripts -->
<script src="/js/script.js"></script>
</body>
</html>

<!-- Gallery Section -->
<main class="gallery">
    <figure>
        <img alt="Karakoy, Istanbul, Turkey" src="/photos/KarakoyIstanbulTurkey.png">
        <figcaption>Karakoy, Istanbul, Turkey</figcaption>
    </figure>
    <figure>
        <img alt="Cappadocia, Nevşehir, Turkey" src="/photos/CappadociaNevsehirTurkey.png">
        <figcaption>Cappadocia, Nevşehir, Turkey</figcaption>
    </figure>
    <figure>
        <img alt="St. Anthony of Padua Church, Istanbul, Turkey" src="/photos/St.AnthonyPaduaChurch.png">
        <figcaption>St. Anthony of Padua Church, Istanbul, Turkey</figcaption>
    </figure>
</main>

<!-- Lightbox container -->
<div class="lightbox" id="lightbox">
    <span class="close" id="closeLightbox">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <!-- Sol ok (SVG ile) -->
    <span class="arrow left" id="lightboxPrev">
      <svg width="40" height="40" viewBox="0 0 40 40">
    <polyline points="25,13 16,20 25,27" fill="none" stroke="#d6d1ca" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <!-- Sağ ok (SVG ile) -->
    <span class="arrow right" id="lightboxNext">
      <svg width="40" height="40" viewBox="0 0 40 40">
        <polyline points="15,13 24,20 15,27" fill="none" stroke="#d6d1ca" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
</div>
