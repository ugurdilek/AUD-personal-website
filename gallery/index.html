<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Gallery</title>
    <link href="/css/!nostyleacx27css.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>

<header>
    <nav class="navbar">
        <ul>
            <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a class="active" href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a></li>
            <li><a href="/resume"><i class="fa-solid fa-file-lines"></i> Resume</a></li>
            <li><a href="/contact"><i class="fa-solid fa-envelope"></i> Contact</a></li>
        </ul>
    </nav>
</header>

<main class="gallery">

    <button class="arrow left arrow">&#10094;</button>
    <figure>
        <img alt="Karakoy, Istanbul, Turkey" src="/photos/KarakoyIstanbulTurkey.png">
        <figcaption>Karakoy, Istanbul, Turkey</figcaption>
    </figure>
    <figure>
        <img alt="Cappadocia, Nevşehir, Turkey" src="/photos/CappadociaNevsehirTurkey.png">
        <figcaption>Cappadocia, Nevsehir, Turkey</figcaption>
    </figure>
    <figure>
        <img alt="St. Anthony of Padua Church ,Istanbul, Turkey" src="/photos/St.AnthonyPaduaChurch.png">
        <figcaption>St. Anthony of Padua Church ,Istanbul, Turkey</figcaption>
    </figure>
    <button class="arrow right arrow">&#10095;</button>
</main>

<div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <img alt="Expanded image" class="lightbox-img" src=""/>
</div>

<script src="/js/script.js"></script>
</body>
</html>
