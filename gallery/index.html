<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery – Ahmet Uğur Dilek</title>
    <meta name="description" content="A gallery showcasing photographs by Ahmet Uğur Dilek.">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.ugurdilek.com/gallery" />

    <!-- Styles -->
    <link rel="preload" href="/css/!nostyleacx27css.css" as="style" />
    <link rel="stylesheet" href="/css/!nostyleacx27css.css" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Font Awesome (loaded asynchronously for performance) -->
    <script>
        window.addEventListener('load', function() {
            const fa = document.createElement('link');
            fa.rel = 'stylesheet';
            fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css';
            fa.crossOrigin = 'anonymous';
            document.head.appendChild(fa);
        });
    </script>

    <!-- Google Analytics (deferred loading for performance) -->
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                const gtagScript = document.createElement('script');
                gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-9P7Z2XMBMH";
                gtagScript.async = true;
                document.head.appendChild(gtagScript);

                window.dataLayer = window.dataLayer || [];
                function gtag() { dataLayer.push(arguments); }
                gtag('js', new Date());
                gtag('config', 'G-9P7Z2XMBMH');
            }, 2000);
        });
    </script>

    <!-- Disable right click -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>

    <!-- Block some keyboard shortcuts (F12, Ctrl+U etc.) -->
    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === 'F12') e.preventDefault();
            if ((e.ctrlKey && e.shiftKey && ['I', 'J'].includes(e.key)) ||
                (e.ctrlKey && ['U', 'S'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
            }
        });
    </script>
</head>

<body>

<!-- Site Header with Navigation -->
<header>
    <nav class="navbar">
        <ul>
            <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a class="active" href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a></li>
            <li><a href="/resume"><i class="fa-solid fa-file-lines"></i> Resume</a></li>
            <li><a href="/contact"><i class="fa-solid fa-envelope"></i> Contact</a></li>
        </ul>
    </nav>

    <!-- Mobile Burger Menu Button -->
    <button class="burger-button" aria-label="Menu">
        <svg viewBox="0 0 100 100" width="40">
            <path class="line top" d="M 30,33 H 70" />
            <path class="line middle" d="M 30,50 H 70" />
            <path class="line bottom" d="M 30,67 H 70" />
        </svg>
    </button>
</header>

<!-- Gallery Section -->
<main class="gallery">
    <figure>
        <img src="/photos/KarakoyIstanbulTurkey.png" alt="Karakoy, Istanbul, Turkey">
        <figcaption>Karakoy, Istanbul, Turkey</figcaption>
    </figure>
    <figure>
        <img src="/photos/CappadociaNevsehirTurkey.png" alt="Cappadocia, Nevşehir, Turkey">
        <figcaption>Cappadocia, Nevşehir, Turkey</figcaption>
    </figure>
    <figure>
        <img src="/photos/St.AnthonyPaduaChurch.png" alt="St. Anthony of Padua Church, Istanbul, Turkey">
        <figcaption>St. Anthony of Padua Church, Istanbul, Turkey</figcaption>
    </figure>
</main>

<!-- Lightbox Modal for Expanded Image View -->
<div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <img src="" alt="Expanded image" class="lightbox-img"/>
</div>

<!-- External JavaScript -->
<script src="/js/script.js"></script>

</body>
</html>
