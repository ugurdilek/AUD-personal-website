<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Burger Menü</title>
    <style>
        body {
          background: #1a1a1a;
          color: white;
          margin: 0;
          font-family: sans-serif;
        }
        .navbar ul {
          list-style: none;
          margin: 0;
          padding: 1rem;
          display: flex;
          gap: 1rem;
          background: #2a2a2a;
        }
        .burger-button {
          background: none;
          border: none;
          cursor: pointer;
          padding: 1rem;
          display: none;
          position: absolute;
          top: 1rem;
          right: 1rem;
          z-index: 1001;
        }
        .burger-button .line {
          fill: none;
          stroke: #fff;
          stroke-width: 6;
          stroke-linecap: round;
          transition: all 0.3s ease;
        }
        .burger-button.active .top {
          transform: translateY(17px) rotate(45deg);
        }
        .burger-button.active .middle {
          opacity: 0;
        }
        .burger-button.active .bottom {
          transform: translateY(-17px) rotate(-45deg);
        }

        @media (max-width: 768px) {
          .burger-button {
            display: block;
          }
          .navbar ul {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 60px;
            right: 1rem;
            background: #2a2a2a;
            padding: 1rem;
            border-radius: 8px;
          }
          .navbar ul.show {
            display: flex;
          }
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Gallery</a></li>
        </ul>
    </nav>

    <button class="burger-button" aria-label="Menu">
        <svg viewBox="0 0 100 100" width="40">
            <path class="line top" d="M 30,33 H 70" />
            <path class="line middle" d="M 30,50 H 70" />
            <path class="line bottom" d="M 30,67 H 70" />
        </svg>
    </button>
</header>

<script>
    const burgerButton = document.querySelector('.burger-button');
    const navList = document.querySelector('.navbar ul');

    burgerButton.addEventListener('click', () => {
      burgerButton.classList.toggle('active');
      navList.classList.toggle('show');
    });
</script>

</body>
</html>
