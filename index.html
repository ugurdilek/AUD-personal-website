<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Home</title>

    <style>
        /* GLOBAL - DARK THEME */
        body {
            font-family: sans-serif;
            margin: 0;
            background-color: #1a1a1a;
            color: #f5f5f5;
        }

        html, body {
            overflow-x: hidden;
        }

        /* NAVIGATION (All Pages) */
        .navbar ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem 0;
            margin: 0;
            background-color: #2a2a2a;
        }

        .navbar ul li a {
            text-decoration: none;
            color: #f5f5f5;
            font-weight: normal;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar ul li a:hover {
            color: #00bcd4;
        }

        .navbar ul li a.active {
            font-weight: bold;
            color: #00bcd4;
        }

        /* HOMEPAGE */
        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
            background-color: #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        /* GALLERY PAGE */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        /* Lightbox for Gallery */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }

        .lightbox .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }

        /* RESUME PAGE */
        .resume-page {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #2a2a2a;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .resume-page section {
            margin-bottom: 2rem;
        }

        .resume-page h1,
        .resume-page h2 {
            color: #9e9e9e;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .resume-page ul {
            padding-left: 1.2rem;
            margin: 0;
        }

        .resume-page li {
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }

        /* CONTACT PAGE */
        .content a {
            color: #00bcd4;
            text-decoration: none;
            font-weight: 500;
        }

        .content a:hover {
            color: #ffcc00;
            text-decoration: underline;
        }

        .contact-icons {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .contact-icons a {
            color: #00bcd4;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-icons a:hover {
            color: #ffcc00;
            text-decoration: underline;
        }

        /* Responsive navbar */
        @media (max-width: 768px) {
            .navbar {
                position: relative;
            }

            .navbar ul {
                display: flex !important;
                flex-direction: column;
                background-color: #2a2a2a;
                position: static;
                width: 100%;
                padding: 1rem 0;
                z-index: 1000;
            }

            .navbar ul li {
                text-align: center;
                padding: 1rem 0;
            }
        }

        /* Resume Download Button */
        .view-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background-color: #9e9e9e;
            color: #121212;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .view-link:hover {
            background-color: #9e9e9e;
            color: #ffffff;
        }

        /* Resume Table Structure */
        .resume-table {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .resume-table li {
            display: grid;
            grid-template-columns: 350px 20px 280px 20px 200px;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .resume-table .role {
            font-weight: 600;
            color: #f5f5f5;
        }

        .resume-table .company {
            color: #cccccc;
        }

        .resume-table .dates {
            color: #999999;
        }

        .resume-table .dash {
            color: #666;
        }

        .resume-table.education li {
            grid-template-columns: 300px 20px 300px 20px 180px;
        }
    </style>

</head>

        <ul>
            <li><a class="active" href="/"><i class="fa-solid fa-house"></i> Home</a></li>
